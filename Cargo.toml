[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/supervisor",
    "crates/caddy-config",
    "crates/runtime-manager",
    "crates/db-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["4Forge Authors"]
license = "Apache-2.0"
homepage = "https://github.com/4forge/4forge"
repository = "https://github.com/4forge/4forge"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3.17"
