<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1E293B" stroke-width="8" />

  <!-- Inner Soft Glow -->
  <circle cx="256" cy="256" r="160" fill="#0EA5E9" opacity="0.12" filter="url(#glow)" />

  <!-- Stylized "4" + Forge Anvil Shape -->
  <g transform="translate(116, 106)">
    <!-- Main stem of 4 / Forge Pillar -->
    <path d="M190 20 L240 20 L240 260 L190 260 Z" fill="url(#grad)" rx="8" />
    <!-- Diagonal stroke of 4 -->
    <path d="M190 20 L50 170 L50 210 L190 210 Z" fill="url(#grad)" rx="8" />
    <!-- Horizontal Crossbar (Anvil table) -->
    <rect x="20" y="170" width="250" height="40" rx="10" fill="url(#grad)" />
    <!-- Glowing core flame / spark accent -->
    <polygon points="190,170 230,130 215,170" fill="url(#accent)" />
    <!-- Base Anvil Support -->
    <path d="M160 250 L270 250 L260 280 L170 280 Z" fill="#334155" opacity="0.9" />
  </g>
</svg>
