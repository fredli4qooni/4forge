[package]
name = "forge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "forge"

[lib]
name = "forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "forge"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

forge-supervisor = { path = "../crates/supervisor" }
forge-caddy-config = { path = "../crates/caddy-config" }
forge-runtime-manager = { path = "../crates/runtime-manager" }
forge-db-manager = { path = "../crates/db-manager" }
